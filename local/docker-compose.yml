version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    volumes:
      - mongo_data:/data/db
    networks:
      - local_net

  server:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      - mongo
    networks:
      - local_net

  web:
    build:
      context: ../cloud/web
      args:
        VITE_MODE: local
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - local_net

  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: local-filebrowser
    ports:
      - "8080:80"
    volumes:
      - /mnt/eca92faf-7af1-44b5-a96f-93febab1aa22/files:/srv
      - filebrowser_data:/database
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    networks:
      - local_net

volumes:
  mongo_data:
  filebrowser_data:

networks:
  local_net:
