version: "3.9"

services:
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - local_net

  # Підключається до існуючого MongoDB (наприклад Home Assistant network)
  # Або запускає власний:
  # mongo:
  #   image: mongo:7
  #   restart: unless-stopped
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - local_net

networks:
  local_net:
    external: true   # підключити до існуючої docker network (HA)
    name: homeassistant_default  # замінити на назву своєї мережі
