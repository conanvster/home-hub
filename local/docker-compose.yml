version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    volumes:
      - mongo_data:/data/db
    networks:
      - local_net

  server:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3002:3002"
    depends_on:
      - mongo
    networks:
      - local_net

  web:
    build:
      context: ../cloud/web
      args:
        VITE_MODE: local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - local_net

volumes:
  mongo_data:

networks:
  local_net:
